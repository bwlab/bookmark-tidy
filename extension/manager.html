<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="pageTitle">Preferiti · bwlab</title>
  <link rel="stylesheet" href="manager.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand">bwlab <span data-i18n="brandTagline">Preferiti</span></div>
      <a class="credits-link" href="credits.html" target="_blank" rel="noopener" data-i18n="creditsLinkLabel">Credits</a>
    </div>
    <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Cerca tra i preferiti  (premi /)" spellcheck="false">
    <div class="header-right">
      <a class="support-btn" href="https://buymeacoffee.com/bwlab" target="_blank" rel="noopener" data-i18n-title="supportTitle" title="Ti piace Bookmark Tidy? Sostieni lo sviluppo su Buy Me a Coffee">
        <span class="support-icon" aria-hidden="true">☕</span><span class="support-label" data-i18n="supportLabel">Offrimi un caffè</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" data-i18n-title="themeToggleTitle" title="Cambia tema (dark/light)">
        <span class="theme-icon-dark">🌙</span>
        <span class="theme-icon-light">☀</span>
      </button>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <main>
    <aside id="sidebar">
      <div class="section-title" data-i18n="viewsLabel">Viste</div>
      <div class="presets">
        <button class="preset" data-preset="all" data-i18n="presetAll">Tutti</button>
        <button class="preset" data-preset="recent" data-i18n="presetRecent">Recenti 30gg</button>
        <button class="preset" data-preset="oldest" data-i18n="presetOldest">Più vecchi 100</button>
        <button class="preset" data-preset="stray" data-i18n="presetStray">Senza cartella</button>
      </div>
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;padding-right:12px">
        <span data-i18n="foldersLabel">Cartelle</span>
        <button id="new-root-folder" class="folder-act" data-i18n-title="newFolderRootTitle" title="Nuova cartella in Barra preferiti">
          <span data-i18n="newFolderBtn">+ nuova</span>
        </button>
      </div>
      <nav id="tree"></nav>
    </aside>
    <section id="content">
      <div id="breadcrumb"></div>
      <div class="toolbar">
        <div class="toolbar-left">
          <label data-i18n="sortLabel">Ordine</label>
          <select id="sort">
            <option value="manual" data-i18n="sortManual">Manuale</option>
            <option value="title" data-i18n="sortTitle">Titolo</option>
            <option value="date-desc" data-i18n="sortDateDesc">Recenti prima</option>
            <option value="date-asc" data-i18n="sortDateAsc">Vecchi prima</option>
            <option value="domain" data-i18n="sortDomain">Dominio</option>
          </select>
        </div>
        <span id="count"></span>
      </div>
      <ul id="list"></ul>
    </section>
  </main>
  <footer id="hint">
    <kbd>/</kbd> <span data-i18n="hintSearch">cerca</span> ·
    <kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="hintNav">naviga</span> ·
    <kbd>Enter</kbd> <span data-i18n="hintOpen">apri</span> ·
    <kbd>Ctrl+Click</kbd> <span data-i18n="hintNewTab">nuova tab</span> ·
    <kbd>E</kbd> <span data-i18n="hintRename">rinomina</span> ·
    <kbd>Del</kbd> <span data-i18n="hintDelete">elimina</span> ·
    <kbd>Esc</kbd> <span data-i18n="hintReset">reset</span>
  </footer>
  <dialog id="dialog">
    <form method="dialog">
      <p id="dialog-msg"></p>
      <input id="dialog-input" type="text" spellcheck="false">
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel" class="act" data-i18n="dialogCancel">Annulla</button>
        <button value="ok" id="dialog-ok" class="act primary" data-i18n="dialogOk">OK</button>
      </div>
    </form>
  </dialog>
  <script src="i18n.js"></script>
  <script src="manager.js"></script>
</body>
</html>
